name: Tox

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:


# Limit this workflow to a single run at a time per-branch to avoid wasting worker resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    env:
      PIP_CACHE_DIR: /tmp/pip-cache
      SQLALCHEMY_DATABASE_URI: ${{ matrix.database_uri }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            database_uri: "postgresql://postgres@localhost:54321/postgres"
          - database: sqlite
            database_uri: "sqlite://"
          - database: mssql
            database_uri: "mssql+pyodbc_mssql://SA:Password12!@localhost:14331/tempdb?driver=ODBC+Driver+17+for+SQL+Server"
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:latest' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mssql:
        image: ${{ matrix.database == 'mssql' && 'mcr.microsoft.com/mssql/server' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password12!"
        ports:
          - 14331:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Password12!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.13
            3.12

      - name: install ODBC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: install SQL Server ODBC driver
        if: matrix.database == 'mssql'
        run: |
          source /etc/os-release
          curl -fsSLo /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql17

      - name: prepare pip cache
        run: mkdir -p "$PIP_CACHE_DIR"

      - name: cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('setup.py', 'setup.cfg', 'tox.ini', 'stable-requirements.txt', 'docs/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: install tox
        run: python3.12 -m pip install --upgrade --force-reinstall tox pip

      - name: version checks
        run: |
          python3.12 --version
          python3.13 --version
          python3.14 --version
          tox --version

      - name: run tox
        run: tox

      - name: push code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.database }}
